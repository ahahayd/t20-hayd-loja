<!-- Pergaminho: base clara + fibra (ruído fino) + manchas suaves de idade.
     Ladrilho grande (400x400) para as manchas não virarem padrão visível. -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="fibra" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.30" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="borrao" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#efe3c3"/>
  <g filter="url(#borrao)" fill="#c9ab76">
    <ellipse cx="70"  cy="90"  rx="62" ry="44" opacity=".16"/>
    <ellipse cx="300" cy="60"  rx="78" ry="38" opacity=".12"/>
    <ellipse cx="340" cy="310" rx="56" ry="60" opacity=".15"/>
    <ellipse cx="140" cy="330" rx="86" ry="42" opacity=".11"/>
    <ellipse cx="210" cy="190" rx="70" ry="52" opacity=".07"/>
  </g>
  <rect width="400" height="400" filter="url(#fibra)" opacity=".30"/>
</svg>
